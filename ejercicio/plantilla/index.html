<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="hero">
      <h1>Contacto</h1>
    </header>
    <main class="contenedor">
      <form action="https://formsubmit.co/apgb04@gmail.com" method="post">
        <div id="nombreyapellido">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" placeholder="John">
          </div>

          <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" name="apellido" placeholder="Doe">
          </div>
        </div>

        <div class="campo">
          <label for="correo">Email</label>
          <input type="email" name="correo" placeholder="johndoe@example.com">
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea name="mensaje "placeholder="Cuentanos lo que quieras"></textarea>
        </div>

        <div class="ultima-caja">
          <div>
            <input type="checkbox" id="terminos" name="terminos" />
            <label for="terminos">Acepto los términos y condiciones</label>
          </div>
          <button type="submit">Enviar</button>
        </div>
        <input type="hidden" name="_template" value="box">
        <input type="hidden" name="_next" value="https://ejform-contacto.netlify.app/gracias.html"> 
      </form>
    </main>
  </body>
</html>
